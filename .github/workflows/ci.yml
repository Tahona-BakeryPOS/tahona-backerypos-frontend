name: frontend-ci

# CI independiente del backend: este repo solo contiene la PWA (Angular).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build --configuration production
      # Las E2E corren contra staging (frontend/e2e/README.md); en CI solo se comprueba que compilan.
      - run: npm run e2e:typecheck
      - run: docker build -t bakerypos-web:${{ github.sha }} .
      - uses: actions/upload-artifact@v4
        with:
          name: pos-dist
          path: dist/pos
