name: frontend-ci

# CI independent of the backend: this repo only contains the PWA (Angular).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build --configuration production
      # E2E tests run against staging (frontend/e2e/README.md); in CI it is only checked that they compile.
      - run: npm run e2e:typecheck
      - run: docker build -t bakerypos-web:${{ github.sha }} .
      - name: The deployment compose and the Caddyfile are valid (dummy values, no secrets)
        working-directory: deploy
        env:
          ENVIRONMENT: ci
          VERSION: ${{ github.sha }}
          DOMAIN: ci.invalid
          ACME_EMAIL: ci@ci.invalid
          API_UPSTREAM: https://api.ci.invalid
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker run --rm -e DOMAIN=ci.invalid -e ACME_EMAIL=ci@ci.invalid -e API_UPSTREAM=https://api.ci.invalid bakerypos-web:${{ github.sha }} caddy validate --config /etc/caddy/Caddyfile
      - uses: actions/upload-artifact@v4
        with:
          name: pos-dist
          path: dist/pos
