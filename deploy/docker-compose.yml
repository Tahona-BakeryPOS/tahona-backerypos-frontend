# Frontend (PWA) deployment on a VPS: a single container with Caddy (HTTPS + PWA + /api proxy to the API).
# One environment per VPS, with its own .env (not versioned, see .env.deploy.example). Usage:
#   ./scripts/deploy.sh .env.production
# Nothing sensitive in this file: everything comes from the .env.
name: bakerypos-web-${ENVIRONMENT:?Define ENVIRONMENT (staging or production) in the .env}

services:
  web:
    image: bakerypos-web:${VERSION:?}
    build:
      context: ..
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Define DOMAIN (the frontend's public domain) in the .env}
      ACME_EMAIL: ${ACME_EMAIL:?}
      API_UPSTREAM: ${API_UPSTREAM:?Define API_UPSTREAM (the API's public URL, e.g. https://api.yourbakery.co) in the .env}
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  # Fixed names per environment: they keep the Let's Encrypt certificates between deployments.
  caddy_data:
    name: bakerypos_web_${ENVIRONMENT}_caddy_data
  caddy_config:
    name: bakerypos_web_${ENVIRONMENT}_caddy_config
